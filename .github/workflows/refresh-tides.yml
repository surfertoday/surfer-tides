name: Refresh NOAA and Open Waters tide predictions

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-tides.yml"
      - "scripts/update_tides.py"
      - "scripts/update_openwaters.mjs"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-global-tides
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch NOAA predictions
        run: python scripts/update_tides.py --delay 1.5 --hours 48
      - name: Install Open Waters prediction packages outside the repository
        run: |
          rm -rf node_modules
          npm install --prefix "$RUNNER_TEMP/slackwater" --no-save --no-package-lock @slackwater/database@1.0.1-beta.20261107 @slackwater/engine@1.0.0-beta.13
          ln -s "$RUNNER_TEMP/slackwater/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Calculate licensed Open Waters predictions
        run: node scripts/update_openwaters.mjs
      - name: Remove temporary dependency link
        if: always()
        run: rm -f node_modules
      - name: Commit refreshed tide data and dependency cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve this run's generated data before syncing to latest main.
          mkdir -p "$RUNNER_TEMP/tide-output"
          cp noaa-errors.txt "$RUNNER_TEMP/tide-output/" 2>/dev/null || true
          cp site/data/tides.json site/data/openwaters-tides.json "$RUNNER_TEMP/tide-output/"

          # Avoid JSON rebase conflicts by starting from the latest repository state.
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/tide-output/tides.json" site/data/tides.json
          cp "$RUNNER_TEMP/tide-output/openwaters-tides.json" site/data/openwaters-tides.json
          if [ -f "$RUNNER_TEMP/tide-output/noaa-errors.txt" ]; then
            cp "$RUNNER_TEMP/tide-output/noaa-errors.txt" noaa-errors.txt
          fi

          # node_modules is legacy tracked content; keep it out of future commits.
          rm -rf node_modules
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh global tide predictions and clean dependencies"
            if ! git push; then
              # A separate push may have landed after the fetch. Reapply this
              # run's generated outputs on top of that latest commit and retry.
              git fetch origin main
              git reset --hard origin/main
              cp "$RUNNER_TEMP/tide-output/tides.json" site/data/tides.json
              cp "$RUNNER_TEMP/tide-output/openwaters-tides.json" site/data/openwaters-tides.json
              if [ -f "$RUNNER_TEMP/tide-output/noaa-errors.txt" ]; then
                cp "$RUNNER_TEMP/tide-output/noaa-errors.txt" noaa-errors.txt
              fi
              rm -rf node_modules
              git add -A
              git commit -m "Refresh global tide predictions and clean dependencies" || true
              git push
            fi
          fi

      # GITHUB_TOKEN pushes do not trigger other workflows. Deploy Pages here
      # so every successful data refresh publishes the exact generated files.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # GitHub's artifact API can briefly lag behind a successful upload.
      # Give the Pages artifact time to become visible before deployment.
      - name: Wait for Pages artifact registration
        run: sleep 15
      - name: Deploy live tide map
        id: deployment
        uses: actions/deploy-pages@v4
